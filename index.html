<style>
/* Paleta: bege e rosa claro. Layout: painel de acompanhamento em abas; cabeçalho com contagem regressiva, conteúdo em coluna única de até 980px */
:root{
  --bg:#FBF3EA; --surface:#FFFBF7; --sunk:#F4E7DB; --line:#EAD8CA; --fg:#3A2A2E; --muted:#7A6265;
  --accent:#B9536A; --accent-ink:#FFFFFF; --accent-soft:#F8DDE3;
  --ok:#3F7D57; --ok-soft:#E1F0E4; --warn:#A8690A; --warn-soft:#F8EBD3; --bad:#B23A48; --bad-soft:#F8DEDF;
  --display:"Source Serif 4", Georgia, "Times New Roman", serif;
  --body:Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#231A1C; --surface:#2D2225; --sunk:#1B1315; --line:#46363A; --fg:#F4E8E4; --muted:#BFA7A9;
  --accent:#EFA3B3; --accent-ink:#2A1418; --accent-soft:#4A2C33;
  --ok:#7CC897; --ok-soft:#1F3427; --warn:#E6B05A; --warn-soft:#3B2E18; --bad:#F08A92; --bad-soft:#3F2124; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#231A1C; --surface:#2D2225; --sunk:#1B1315; --line:#46363A; --fg:#F4E8E4; --muted:#BFA7A9;
  --accent:#EFA3B3; --accent-ink:#2A1418; --accent-soft:#4A2C33;
  --ok:#7CC897; --ok-soft:#1F3427; --warn:#E6B05A; --warn-soft:#3B2E18; --bad:#F08A92; --bad-soft:#3F2124; color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.toprow{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;padding-block:16px 10px}
h1{font-family:var(--display);font-size:1.6rem;margin:0;line-height:1.15;text-wrap:balance}
.sub{color:var(--muted);font-size:.85rem;margin-top:2px}
.count{display:flex;gap:8px}
.dchip{border:1px solid var(--line);border-radius:8px;padding:4px 10px;text-align:center;min-width:86px}
.dchip b{display:block;font-family:var(--mono);font-size:1.15rem;font-variant-numeric:tabular-nums}
.dchip span{font-size:.72rem;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.dchip.main{border-color:var(--accent);background:var(--accent-soft)}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav.tabs a{padding:8px 12px;color:var(--muted);text-decoration:none;font-weight:600;font-size:.9rem;border-bottom:2px solid transparent;white-space:nowrap}
nav.tabs a[aria-current="page"]{color:var(--fg);border-bottom-color:var(--accent)}
nav.tabs a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{padding-block:20px 48px;display:grid;gap:20px}
main>section{display:grid;gap:16px;min-width:0}
@media (max-width:700px){header.top{position:static}}
h2{font-family:var(--display);font-size:1.25rem;margin:0 0 10px;text-wrap:balance}
h3{font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
.note{font-size:.85rem;color:var(--muted)}
.banner{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 12px;font-size:.88rem}
.banner.warn{border-color:var(--warn);background:var(--warn-soft)}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;min-width:0}
.kpi .v{font-family:var(--mono);font-size:1.35rem;font-variant-numeric:tabular-nums}
.kpi .l{font-size:.78rem;color:var(--muted)}
.bar{height:6px;background:var(--sunk);border-radius:3px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--accent)}
@media (max-width:640px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.day{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.dayhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.dayhead .date{font-family:var(--display);font-size:1.15rem;font-weight:700}
.item{padding:12px 14px;border-top:1px solid var(--line);display:grid;gap:10px}
.item:first-of-type{border-top:0}
.mrow{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap}
.mat{font-weight:700}
.focus{font-size:.92rem;min-width:0}
.meta{font-size:.8rem;color:var(--muted)}
.guia{font-size:.82rem;background:var(--sunk);border-radius:6px;padding:6px 8px}
.mats{display:flex;flex-wrap:wrap;gap:6px}
.mtag{font-size:.78rem;border:1px solid var(--line);border-radius:999px;padding:2px 9px;background:var(--bg)}
.mtag b{font-family:var(--mono);font-weight:500;color:var(--accent)}
.pill{font-size:.75rem;font-weight:600;border-radius:999px;padding:2px 9px;white-space:nowrap}
.p-feito{background:var(--ok-soft);color:var(--ok)}.p-parcial{background:var(--warn-soft);color:var(--warn)}.p-atraso{background:var(--bad-soft);color:var(--bad)}.p-futuro{background:var(--sunk);color:var(--muted)}.p-hoje{background:var(--accent-soft);color:var(--accent)}
.log{display:grid;grid-template-columns:auto repeat(3,minmax(70px,96px)) minmax(0,1fr);gap:8px;align-items:end}
@media (max-width:700px){.log{grid-template-columns:repeat(3,minmax(0,1fr))}.log .seg,.log .obs{grid-column:1/-1}}
label.f{display:grid;gap:2px;font-size:.74rem;color:var(--muted);min-width:0}
input,select,textarea{font:inherit;font-size:.9rem;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px 8px;width:100%;min-width:0}
input[type=number]{font-family:var(--mono);font-variant-numeric:tabular-nums}
textarea{resize:vertical;min-height:38px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;align-self:end}
.seg button{font:inherit;font-size:.82rem;font-weight:600;padding:6px 10px;border:0;background:var(--bg);color:var(--muted);cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"][data-v="feito"]{background:var(--ok);color:var(--surface)}
.seg button[aria-pressed="true"][data-v="parcial"]{background:var(--warn);color:var(--surface)}
.seg button[aria-pressed="true"][data-v="nao"]{background:var(--bad);color:var(--surface)}
button.btn{font:inherit;font-weight:600;font-size:.88rem;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);border-radius:7px;padding:7px 14px;cursor:pointer}
button.ghost{background:transparent;color:var(--accent)}
button:disabled,input:disabled,select:disabled,textarea:disabled{opacity:.55;cursor:not-allowed}
.saved{font-size:.75rem;color:var(--muted);min-height:1em}
.week{display:grid;gap:8px}
.wkhead{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap;margin-top:8px}
details.row{background:var(--surface);border:1px solid var(--line);border-radius:8px}
details.row>summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:62px minmax(0,1fr) auto;gap:10px;padding:9px 12px;align-items:center}
details.row>summary::-webkit-details-marker{display:none}
details.row[open]>summary{border-bottom:1px solid var(--line)}
details.row .dd{font-family:var(--mono);font-size:.85rem;font-variant-numeric:tabular-nums}
details.row .dd small{display:block;color:var(--muted);font-family:var(--body);font-size:.7rem}
details.row .t{min-width:0}
details.row .t .mat{font-size:.88rem}
details.row .t .focus{font-size:.82rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
details.row .body{padding:10px 12px;display:grid;gap:10px}
details.row.today{border-color:var(--accent)}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.filters select{width:auto}
.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:.86rem}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:.72rem;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:600;background:var(--sunk)}
td.n,th.n{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
tr:last-child td{border-bottom:0}
.acc{display:flex;align-items:center;gap:8px;min-width:120px}
.acc .bar{flex:1;margin:0}
.acc .bar i.good{background:var(--ok)}.acc .bar i.mid{background:var(--warn)}.acc .bar i.low{background:var(--bad)}
svg text{fill:var(--muted);font-family:var(--body);font-size:11px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px}
.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.formgrid .wide{grid-column:1/-1}
@media (max-width:600px){.formgrid{grid-template-columns:minmax(0,1fr)}}
.err{display:grid;gap:6px}
.err .rule{font-size:.9rem}
.err .bot{display:flex;gap:10px;flex-wrap:wrap;align-items:center;font-size:.8rem;color:var(--muted)}
.err .bot select{width:auto;font-size:.8rem;padding:3px 6px}
.empty{padding:18px;text-align:center;color:var(--muted);font-size:.9rem;border:1px dashed var(--line);border-radius:8px}
.mtag{cursor:pointer;font:inherit;font-size:.78rem;color:var(--fg)}
.mtag:hover{border-color:var(--accent)}
.matlist{display:grid;gap:10px}
.matcard{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:grid;gap:8px}
.matcard .mrow b.num{font-family:var(--mono);color:var(--accent);margin-right:6px}
.matcard details summary{cursor:pointer;font-size:.82rem;color:var(--muted)}
.toc{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:2px}
.toc button{all:unset;cursor:pointer;display:flex;justify-content:space-between;gap:12px;font-size:.84rem;padding:4px 6px;border-radius:5px;width:100%;box-sizing:border-box}
.toc button:hover,.toc button:focus-visible{background:var(--sunk)}
.toc .pg{font-family:var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}
#viewer{position:fixed;inset:0;z-index:50;background:var(--sunk);display:flex;flex-direction:column}
#viewer .vbar{background:var(--surface);border-bottom:1px solid var(--line);padding:calc(env(safe-area-inset-top,0px) + 8px) max(12px,env(safe-area-inset-right,0px)) 8px max(12px,env(safe-area-inset-left,0px));display:flex;flex-wrap:wrap;gap:8px;align-items:center}
#viewer .vt{font-weight:700;font-size:.9rem;flex:1 1 180px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#viewer .vctl{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
#viewer .vctl button{font:inherit;font-size:.85rem;font-weight:600;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:6px;padding:5px 10px;cursor:pointer;min-width:34px}
#viewer .vctl input{width:58px;text-align:center;padding:4px}
#viewer .vctl select{width:auto;max-width:min(320px,70vw);font-size:.82rem;padding:4px 6px}
#viewer .vpage{flex:1;overflow:auto;padding:12px max(12px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 16px) max(12px,env(safe-area-inset-left,0px));-webkit-overflow-scrolling:touch}

#viewer .vmsg{text-align:center;color:var(--muted);padding:40px 12px}
body.noscroll{overflow:hidden}
@media (max-width:600px){#viewer .vctl{width:100%}#viewer .vctl select{max-width:none;flex:1 1 100%}}
[hidden]{display:none!important}
@media (prefers-reduced-motion:no-preference){.bar i{transition:width .4s ease}}
a.btn,label.btn{display:inline-flex;align-items:center;border:1px solid var(--accent);color:var(--accent);background:transparent;border-radius:7px;padding:7px 14px;font-weight:600;font-size:.88rem;cursor:pointer}
html{color-scheme:light}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){color-scheme:dark}}
body{margin:0;-webkit-text-size-adjust:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
</style>
</head>

function isStudy(r){ return r.h>0 && !NONSTUDY.has(r.m); }
function stateOf(r){
  const l=LOG[r.k]||{};
  if(l.status==="feito") return ["feito","Feito"];
  if(l.status==="parcial") return ["parcial","Parcial"];
  if(r.d===TODAY) return ["hoje","Hoje"];
  if(r.d<TODAY && isStudy(r)) return ["atraso", l.status==="nao"?"Não feito":"Pendente"];
  return ["futuro", r.d<TODAY?"–":"Previsto"];
}

}

function dayCard(d, title){
  const rs=ROWS.filter(r=>r.d===d);
  if(!rs.length) return "";
  return `<div class="day"><div class="dayhead"><span class="date">${title||""} ${br(d)} · ${wd(d)}</span><span class="meta">${esc(rs[0].fase)}</span></div>${rs.map(itemHtml).join("")}<div class="item" style="border-top:1px solid var(--line)">${matsHtml(d)||'<span class="meta">Sem leitura de lei seca prevista para este dia.</span>'}</div></div>`;
}

function totals(filter){
  let hp=0,hf=0,q=0,a=0,dp=0,df=0;
  for(const r of ROWS){ if(filter && !filter(r)) continue; const l=LOG[r.k]||{};
    if(isStudy(r)){ hp+=r.h; if(r.d<=TODAY){dp++; if(l.status==="feito") df++;} }
    hf+=num(l.horas); q+=num(l.questoes); a+=num(l.acertos); }
  return {hp,hf,q,a,dp,df};
}

function renderHoje(){
  const el=document.getElementById("v-hoje");

  const pend=ROWS.filter(r=>r.d<TODAY && isStudy(r) && (LOG[r.k]||{}).status!=="feito");
  const yest=ROWS.filter(r=>r.d<TODAY && isStudy(r)).map(r=>r.d).pop();
  const next=ROWS.find(r=>r.d>TODAY)?.d;
  let todayHtml = ROWS.some(r=>r.d===TODAY) ? dayCard(TODAY,"Hoje,") : `<div class="empty">Não há estudo previsto para hoje no cronograma.</div>`;

  ${next?`<div><h2>Próximo dia de estudo</h2>${dayCard(next,"")}</div>`:""}`;

function weekKey(d){ const dt=parse(d); const off=(dt.getDay()+6)%7; dt.setDate(dt.getDate()-off); return iso(dt); }

function renderDes(){
  const el=document.getElementById("v-desempenho");

function statusErr(e){ return e.r1==="Sim"&&e.r2==="Sim"?"Resolvido":"Pendente"; }
let errFilter="Pendente";
function renderErr(){
  const el=document.getElementById("v-erros"), dis=canWrite?"":"disabled";
  const list=ERR.filter(e=>errFilter==="Todos"||statusErr(e)===errFilter).sort((a,b)=>(b.data||"").localeCompare(a.data||""));
  const opt=(arr,sel)=>arr.map(x=>`<option ${x===sel?"selected":""}>${esc(x)}</option>`).join("");
  el.innerHTML = `<h2>Caderno de erros</h2>
  <form id="errForm" class="card formgrid">
    <label class="f">Matéria<select id="e-mat" required ${dis}>${opt(MATERIAS)}</select></label>
    <label class="f">Causa do erro<select id="e-causa" ${dis}>${opt(CAUSAS)}</select></label>
    <label class="f">Tema<input id="e-tema" required placeholder="Ex.: competência territorial" ${dis}></label>
    <label class="f">Questão (banca, órgão, ano, nº)<input id="e-q" placeholder="Ex.: FCC, TRT4, 2022, nº 41" ${dis}></label>
    <label class="f wide">Regra correta e fundamento<textarea id="e-regra" required rows="2" placeholder="Ex.: art. 651, § 3º, da CLT; OJ 149 da SBDI-II" ${dis}></textarea></label>
    <label class="f">Alerta no enunciado<input id="e-alerta" ${dis}></label>
    <label class="f">Ver no material<input id="e-ver" placeholder="Ex.: 04 Processo do Trabalho, 08/12" ${dis}></label>
    <div class="wide" style="display:flex;gap:10px;align-items:center"><button class="btn" type="submit" ${dis}>Registrar erro</button><span class="saved" id="e-msg"></span></div>
  </form>
  <div class="filters"><span class="meta" style="flex:1">${ERR.filter(e=>statusErr(e)==="Pendente").length} pendentes · ${ERR.length} registrados. Refaça a questão no domingo da semana (1ª revisão) e no domingo seguinte (2ª revisão).</span>
    <label class="f">Mostrar<select id="errSel">${opt(["Pendente","Resolvido","Todos"],errFilter)}</select></label></div>
  ${list.length?list.map(e=>`<div class="card err" data-id="${e.id}">
    <div class="mrow"><span><b>${esc(e.materia)}</b> · ${esc(e.tema)}</span><span class="pill ${statusErr(e)==="Resolvido"?"p-feito":"p-atraso"}">${statusErr(e)}</span></div>
    <div class="rule">${esc(e.regra)}</div>
    <div class="bot"><span>${e.data?br(e.data):""}${e.questao?" · "+esc(e.questao):""}${e.causa?" · "+esc(e.causa):""}${e.alerta?" · alerta: "+esc(e.alerta):""}${e.ver?" · ver: "+esc(e.ver):""}</span>
      <label>1ª revisão <select data-f="r1" ${dis}>${opt(["","Sim","Não"],e.r1||"")}</select></label>
      <label>2ª revisão <select data-f="r2" ${dis}>${opt(["","Sim","Não"],e.r2||"")}</select></label>
      <button type="button" class="btn ghost" data-del ${dis}>Excluir</button></div></div>`).join(""):`<div class="empty">${ERR.length?"Nenhum erro com esse filtro.":"Nenhum erro registrado ainda. Use o formulário acima depois de cada bateria de questões."}</div>`}`;
  document.getElementById("errSel").onchange=e=>{errFilter=e.target.value; renderErr();};
  document.getElementById("errForm").onsubmit=async ev=>{ev.preventDefault(); if(!canWrite) return;
    const g=id=>document.getElementById(id).value.trim();
    const doc={data:TODAY,materia:g("e-mat"),causa:g("e-causa"),tema:g("e-tema"),questao:g("e-q"),regra:g("e-regra"),alerta:g("e-alerta"),ver:g("e-ver"),r1:"",r2:""};
    const msg=document.getElementById("e-msg");
    try{ await db.collection("erros").add(doc); msg.textContent="Erro registrado."; ["e-tema","e-q","e-regra","e-alerta","e-ver"].forEach(i=>document.getElementById(i).value=""); }
    catch(err){ msg.textContent = err&&err.code==="quota_exceeded" ? "O caderno atingiu o limite de registros. Exclua erros resolvidos para liberar espaço." : "Não foi possível registrar. Tente de novo em instantes."; }
  };
  el.querySelectorAll(".err select").forEach(s=>s.onchange=async()=>{const id=s.closest(".err").dataset.id; try{await db.doc("erros/"+id).update({[s.dataset.f]:s.value});}catch(e){setStatus("Não foi possível salvar a revisão. Tente de novo.","warn");}});
  el.querySelectorAll("[data-del]").forEach(b=>{let armed=false; b.onclick=async()=>{ if(!armed){armed=true;b.textContent="Confirmar exclusão";setTimeout(()=>{armed=false;b.textContent="Excluir"},4000);return;} const id=b.closest(".err").dataset.id; try{await db.doc("erros/"+id).delete();}catch(e){setStatus("Não foi possível excluir. Tente de novo.","warn");} };});
}

async function save(col,id,data,svEl){
  if(!db||!canWrite) return;
  try{ await db.doc(col+"/"+id).set({...data, atualizado:new Date().toISOString()}); if(svEl) svEl.textContent="Salvo"; }
  catch(e){ if(svEl) svEl.textContent="Não foi possível salvar. Confira a conexão e edite de novo."; if(e&&e.code==="invalid_argument"){canWrite=false; setStatus("Esta visualização só pode ler os registros.","warn");} }
}

// delegação para os registros diários
document.addEventListener("click",e=>{
  const b=e.target.closest(".log .seg button"); if(!b||!canWrite) return;
  const k=b.closest(".log").dataset.k; const v={...(LOG[k]||{})}; v.status = v.status===b.dataset.v ? "" : b.dataset.v;
  if(v.status==="feito" && (v.horas===""||v.horas==null)){ const r=ROWS.find(x=>x.k===k); v.horas=String(r.h); }
  LOG[k]=v; save("dias",k,v,document.getElementById("sv-"+k)); renderAll(true);
});
document.addEventListener("input",e=>{
  const inp=e.target.closest(".log [data-f]"); if(!inp||!canWrite) return;
  const k=inp.closest(".log").dataset.k; const v={...(LOG[k]||{})}; v[inp.dataset.f]=inp.value; LOG[k]=v;
  const sv=document.getElementById("sv-"+k); if(sv) sv.textContent="Salvando…";
  clearTimeout(timers[k]); timers[k]=setTimeout(()=>save("dias",k,v,document.getElementById("sv-"+k)),700);
});
const inLog=()=>{ const a=document.activeElement; return a&&a.matches&&a.matches(".log [data-f]"); };
document.addEventListener("change",e=>{ if(e.target.closest(".log [data-f]")) setTimeout(()=>{ if(!inLog()) renderAll(true); },0); });
document.addEventListener("focusout",e=>{ if(e.target.closest&&e.target.closest(".log [data-f]")) setTimeout(()=>{ if(!inLog()) renderAll(true); },0); });

const MATS = DATA.mats;
const lastPg = n => { try{ return parseInt(localStorage.getItem("pg-"+n))||0; }catch(_){ return 0; } };
function renderMats(){
  const el=document.getElementById("v-materiais");
  el.innerHTML=`<h2>Materiais</h2><p class="note">Os materiais na última versão, com o sumário de cada um. No painel Hoje e no Cronograma, os materiais do dia abrem direto na parte certa.</p>
  <div class="matlist">${MATS.map(m=>{const lp=lastPg(m.n); return `<div class="matcard"><div class="mrow"><span><b class="num">${m.n}</b><b>${esc(m.name)}</b></span><span class="meta">${m.pages} páginas · ${fmt1(m.size/1048576)} MB</span></div>
  <div style="display:flex;gap:8px;flex-wrap:wrap"><button type="button" class="btn" data-open="${m.n}" data-page="1">Abrir</button>${lp>1?`<button type="button" class="btn ghost" data-open="${m.n}" data-page="${lp}">Continuar na página ${lp}</button>`:""}</div>
  <details><summary>Sumário (${m.toc.length} partes)</summary><ul class="toc">${m.toc.map(([t,p])=>`<li><button type="button" data-open="${m.n}" data-page="${p}"><span>${esc(t)}</span><span class="pg">p. ${p}</span></button></li>`).join("")}</ul></details></div>`}).join("")}</div>`;
}

// leitor de PDF
const V={doc:null,n:null,page:1,zoom:1,task:null,cache:{},busy:false,pending:null};
let DL=null;
function fail(text,err){
  const msg=document.getElementById("vMsg"); document.getElementById("vCanvas").hidden=true; msg.hidden=false;
  const det=err?(err.name||"Erro")+": "+(err.message||String(err)):"";
  if(err) console.error("[Painel TRT8]",err);
  msg.innerHTML=`<p>${esc(text)}</p>${det?`<p class="meta">Detalhe técnico: ${esc(det)}</p>`:""}`;
}
function pdfReady(){ if(window.pdfjsLib && !pdfjsLib.GlobalWorkerOptions.workerSrc) pdfjsLib.GlobalWorkerOptions.workerSrc="lib/pdf.worker.min.js"; return !!window.pdfjsLib; }
async function openMat(n,page){
  const m=MATS.find(x=>x.n===n); if(!m) return;
  const v=document.getElementById("viewer"); v.hidden=false; document.body.classList.add("noscroll");
  document.getElementById("vTitle").textContent=m.n+" · "+m.name;
  document.getElementById("vToc").innerHTML=`<option value="">Ir para a parte…</option>`+m.toc.map(([t,p])=>`<option value="${p}">${esc(t)} · p. ${p}</option>`).join("");
  document.getElementById("vTot").textContent="/ "+m.pages;
  document.getElementById("vDl").href="pdf/"+n+".pdf";
  const msg=document.getElementById("vMsg"), cv=document.getElementById("vCanvas");
  V.want=n; V.page=page||1; 
  if(!pdfReady()){ fail("O leitor de PDF do painel não carregou nesta visualização.", new Error("pdfjsLib="+typeof window.pdfjsLib+", pdfjsWorker="+typeof window.pdfjsWorker)); return; }
  if(V.n!==n){
    V.doc=null; V.n=n; cv.hidden=true; msg.hidden=false; msg.textContent="Carregando "+m.name+"…";
    try{
      let buf=V.cache[n];
      if(!buf){ const r=await fetch("pdf/"+n+".pdf"); if(!r.ok) throw new Error("HTTP "+r.status+" ao buscar o material "+n); buf=await r.arrayBuffer(); V.cache={[n]:buf}; }
      V.doc=await pdfjsLib.getDocument({data:buf.slice(0),disableFontFace:false,isEvalSupported:false}).promise;
    }catch(e){ V.n=null; fail("Não foi possível abrir este material no leitor do painel.", e); return; }
  }
  go(page||1);
}
function go(p){
  if(!V.doc) return; p=Math.max(1,Math.min(V.doc.numPages,p|0||1)); V.page=p;
  document.getElementById("vPg").value=p;
  try{ localStorage.setItem("pg-"+V.n,String(p)); }catch(_){}
  if(V.busy){ V.pending=p; return; } draw();
}
async function draw(){
  V.busy=true; const p=V.page;
  try{
    const pg=await V.doc.getPage(p); const box=document.getElementById("vPage");
    const base=pg.getViewport({scale:1}); const fit=Math.min(1.6,(box.clientWidth-24)/base.width);
    const sc=fit*V.zoom, dpr=Math.min(window.devicePixelRatio||1,2.5);
    const vp=pg.getViewport({scale:sc*dpr}); const cv=document.getElementById("vCanvas");
    cv.width=vp.width; cv.height=vp.height; cv.style.width=(vp.width/dpr)+"px"; cv.style.height=(vp.height/dpr)+"px";
    await pg.render({canvasContext:cv.getContext("2d"),viewport:vp}).promise;
    cv.hidden=false; document.getElementById("vMsg").hidden=true; box.scrollTop=0;
  }catch(e){ fail("Não foi possível mostrar esta página no leitor do painel.", e); }
  V.busy=false; if(V.pending&&V.pending!==p){ const q=V.pending; V.pending=null; V.page=q; draw(); } else V.pending=null;
}
function closeViewer(){ document.getElementById("viewer").hidden=true; document.body.classList.remove("noscroll"); if(view==="materiais") renderMats(); }
document.addEventListener("click",e=>{ const b=e.target.closest("[data-open]"); if(!b) return; e.preventDefault(); openMat(b.dataset.open, parseInt(b.dataset.page)||1); });
document.getElementById("vClose").onclick=closeViewer;
document.getElementById("vPrev").onclick=()=>go(V.page-1);
document.getElementById("vNext").onclick=()=>go(V.page+1);
document.getElementById("vPg").onchange=e=>go(parseInt(e.target.value));
document.getElementById("vToc").onchange=e=>{ if(e.target.value) go(parseInt(e.target.value)); e.target.value=""; };
document.getElementById("vIn").onclick=()=>{ V.zoom=Math.min(3,V.zoom*1.25); draw(); };
document.getElementById("vOut").onclick=()=>{ V.zoom=Math.max(.5,V.zoom/1.25); draw(); };
document.addEventListener("keydown",e=>{ if(document.getElementById("viewer").hidden) return; if(e.target.matches("input,select,textarea")) return;
  if(e.key==="Escape") closeViewer(); if(e.key==="ArrowRight") go(V.page+1); if(e.key==="ArrowLeft") go(V.page-1); });
let tx=null; const vpEl=document.getElementById("vPage");
vpEl.addEventListener("touchstart",e=>{ tx=e.touches.length===1?[e.touches[0].clientX,e.touches[0].clientY]:null; },{passive:true});
vpEl.addEventListener("touchend",e=>{ if(!tx||V.zoom>1.01) return; const t=e.changedTouches[0], dx=t.clientX-tx[0], dy=t.clientY-tx[1]; if(Math.abs(dx)>70&&Math.abs(dx)>2*Math.abs(dy)) go(V.page+(dx<0?1:-1)); tx=null; });
window.addEventListener("resize",()=>{ if(!document.getElementById("viewer").hidden&&V.doc) draw(); });

let view="hoje";
function renderAll(keepFocus){
  const ae=document.activeElement, id=ae&&ae.id, s=ae&&ae.selectionStart;
  const openRows=[...document.querySelectorAll("#v-cronograma details[open] .log")].map(x=>x.dataset.k);
  countdown();
  if(view==="hoje") renderHoje();
  if(view==="cronograma"){ renderCrono(); openRows.forEach(k=>{const l=document.querySelector(`#v-cronograma .log[data-k="${k}"]`); if(l) l.closest("details").open=true;}); }
  if(view==="desempenho") renderDes();
  if(view==="simulados") renderSim();
  if(view==="erros") renderErr();
  if(view==="materiais") renderMats();
  if(view==="backup") renderBackup();
  if(keepFocus&&id){ const n=document.getElementById(id); if(n){ n.focus(); try{ if(s!=null) n.setSelectionRange(s,s);}catch(_){} } }
}
function route(){
  const h=(location.hash||"#hoje").slice(1); view=["hoje","cronograma","desempenho","simulados","erros","materiais","backup"].includes(h)?h:"hoje";
  document.querySelectorAll("[data-view]").forEach(s=>s.hidden=s.dataset.view!==view);
  document.querySelectorAll("nav.tabs a").forEach(a=>{ if(a.dataset.v===view) a.setAttribute("aria-current","page"); else a.removeAttribute("aria-current"); });
  renderAll(false);
}
window.addEventListener("hashchange",route);
route();

// armazenamento local
const KEY="painel-trt8-v1";
function loadStore(){ try{ return JSON.parse(localStorage.getItem(KEY)||"{}"); }catch(_){ return null; } }
function persist(){ try{ localStorage.setItem(KEY, JSON.stringify({dias:LOG, simulados:SIM, erros:ERR, salvo:new Date().toISOString()})); return true; }catch(_){ setStatus("Não foi possível salvar no aparelho. Exporte um backup na aba Backup.","warn"); return false; } }
let rt=null; const later=()=>{ clearTimeout(rt); rt=setTimeout(()=>{ const a=document.activeElement; if(!(a&&(a.matches(".log [data-f]")||a.closest("#v-simulados")||a.closest("#errForm")))) renderAll(true); },50); };
db={
  doc(path){ const [col,id]=path.split("/"); return {
    async set(d){ if(col==="dias") LOG[id]=d; else if(col==="simulados") SIM[id]=d; persist(); },
    async update(p){ const e=ERR.find(x=>x.id===id); if(e) Object.assign(e,p); persist(); later(); },
    async delete(){ ERR=ERR.filter(x=>x.id!==id); persist(); later(); } }; },
  collection(col){ return { async add(d){ ERR.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),...d}); persist(); later(); } }; }
};
(function(){
  const st=loadStore();
  if(st===null){ setStatus("Este navegador não permite guardar registros no aparelho. Os registros não serão salvos.","warn"); db=null; return; }
  LOG=st.dias||{}; SIM=st.simulados||{}; ERR=st.erros||[]; canWrite=true;
  try{ navigator.storage&&navigator.storage.persist&&navigator.storage.persist(); }catch(_){}
  renderAll(false);
})();

function renderBackup(){
  const el=document.getElementById("v-backup"); const st=loadStore()||{};
  el.innerHTML=`<h2>Backup dos registros</h2>
  <p class="note">Os registros ficam só neste aparelho. Exporte um backup toda semana, por exemplo no domingo de revisão, e guarde o arquivo no app Arquivos ou no seu e-mail. Para levar os registros a outro aparelho, importe o arquivo lá.</p>
  <div class="card" style="display:grid;gap:10px">
    <div class="meta">${Object.keys(LOG).length} dias com registro · ${Object.keys(SIM).length} simulados · ${ERR.length} erros${st.salvo?" · última gravação em "+new Date(st.salvo).toLocaleString("pt-BR"):""}</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap"><button type="button" class="btn" id="bExp">Exportar backup</button>
    <label class="btn ghost" style="display:inline-flex;align-items:center;cursor:pointer">Importar backup<input type="file" id="bImp" accept=".json,application/json" hidden></label></div>
    <span class="saved" id="bMsg"></span>
  </div>
  <h2>Materiais sem internet</h2>
  <p class="note">Cada material fica guardado no aparelho depois de aberto uma vez. Para guardar todos de uma vez (cerca de 80 MB), use o botão abaixo com Wi-Fi.</p>
  <div class="card" style="display:grid;gap:10px"><div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center"><button type="button" class="btn" id="bAll">Guardar todos os materiais</button><span class="saved" id="bAllMsg"></span></div></div>`;
  document.getElementById("bExp").onclick=()=>{
    const data=JSON.stringify({app:"Painel TRT8",versao:1,exportado:new Date().toISOString(),dias:LOG,simulados:SIM,erros:ERR},null,1);
    const url=URL.createObjectURL(new Blob([data],{type:"application/json"}));
    const a=document.createElement("a"); a.href=url; a.download="backup_painel_trt8_"+TODAY+".json"; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),4000); document.getElementById("bMsg").textContent="Backup gerado. Salve o arquivo no app Arquivos.";
  };
  document.getElementById("bImp").onchange=async e=>{ const f=e.target.files[0]; if(!f) return; const msg=document.getElementById("bMsg");
    try{ const d=JSON.parse(await f.text()); if(!d||d.app!=="Painel TRT8") throw 0;
      LOG=d.dias||{}; SIM=d.simulados||{}; ERR=d.erros||[]; persist(); renderBackup(); document.getElementById("bMsg").textContent="Backup importado.";
    }catch(_){ msg.textContent="Este arquivo não é um backup do Painel de Estudos."; } };
  document.getElementById("bAll").onclick=async()=>{ const m=document.getElementById("bAllMsg"); let ok=0;
    for(const x of MATS){ m.textContent=`Guardando ${x.n} de ${MATS.length}…`; try{ const r=await fetch("pdf/"+x.n+".pdf"); if(r.ok){ await r.arrayBuffer(); ok++; } }catch(_){} }
    m.textContent= ok===MATS.length ? `Os ${MATS.length} materiais estão guardados no aparelho.` : `${ok} de ${MATS.length} guardados. Confira a conexão e toque de novo.`; };
}
window.addEventListener("pagehide",()=>{ if(canWrite) persist(); }); document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="hidden"&&canWrite) persist(); });
if("serviceWorker" in navigator){ window.addEventListener("load",()=>{ navigator.serviceWorker.register("sw.js").catch(()=>{}); }); }
</script>
